name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (optional, defaults to v<versionName> from AndroidManifest.xml)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Ensure Android SDK 34 platform & build-tools
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER=""
          for candidate in \
            "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_DIR/cmdline-tools/bin/sdkmanager" \
            "$SDK_DIR/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found under $SDK_DIR" >&2
            exit 1
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          set -o pipefail
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;35.0.0"

      - name: Restore signing keystore from secret (if configured)
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p keystore
            printf '%s' "$KEYSTORE_B64" | base64 -d > keystore/sonycam.jks
            echo "Restored signing keystore from repository secret."
          else
            echo "No SIGNING_KEYSTORE_BASE64 secret configured; scripts/build.sh will generate an ephemeral keystore."
          fi

      - name: Build and verify signed APK
        run: bash scripts/build.sh

      - name: Prepare release assets and notes
        id: meta
        run: |
          MANIFEST="app/src/main/AndroidManifest.xml"
          VERSION_NAME="$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' "$MANIFEST" | head -n 1)"
          VERSION_CODE="$(sed -n 's/.*android:versionCode="\([^"]*\)".*/\1/p' "$MANIFEST" | head -n 1)"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="v${VERSION_NAME}"
          fi
          mkdir -p dist
          cp build/sonycam-guard.apk dist/sonycam-guard.apk
          cp build/sonycam-guard.apk "dist/sonycam-guard-${TAG}.apk"
          (cd dist && sha256sum sonycam-guard.apk "sonycam-guard-${TAG}.apk" > SHA256SUMS.txt)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          {
            echo "## BraviaCam Guard ${TAG}"
            echo ""
            echo "Sony BRAVIA TV (Android TV 14) 專用 **CMU-BC1** 智慧禮讓監控與資安監管 APK。"
            echo ""
            echo "- **Version Name**: \`${VERSION_NAME}\`"
            echo "- **Version Code**: \`${VERSION_CODE}\`"
            echo "- **SHA256 Checksums**:"
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
            echo "- **安裝指令**："
            echo '```bash'
            echo "adb connect <TV_IP>:<ADB_PORT>"
            echo "adb install -r sonycam-guard.apk"
            echo '```'
            echo ""
            echo "---"
            echo "Powered by NyphexAI, Developed by Hikaru(i@rua.moe)"
          } > dist/release_notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/sonycam-guard.apk \
              "dist/sonycam-guard-${TAG}.apk" \
              dist/SHA256SUMS.txt \
              --clobber
            gh release edit "$TAG" \
              --title "BraviaCam Guard $TAG" \
              --notes-file dist/release_notes.md
          else
            gh release create "$TAG" \
              dist/sonycam-guard.apk \
              "dist/sonycam-guard-${TAG}.apk" \
              dist/SHA256SUMS.txt \
              --title "BraviaCam Guard $TAG" \
              --notes-file dist/release_notes.md
          fi
